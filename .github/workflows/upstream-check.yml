name: Upstream check

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC -- temporary, watching first few runs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nvim_asset: nvim-linux-x86_64
            ts_asset: tree-sitter-cli-linux-x64
          - os: macos-latest
            nvim_asset: nvim-macos-arm64
            ts_asset: tree-sitter-cli-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (stable)
        run: |
          curl -fsSLo /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/${{ matrix.nvim_asset }}.tar.gz
          tar -C /tmp -xzf /tmp/nvim.tar.gz
          echo "/tmp/${{ matrix.nvim_asset }}/bin" >> "$GITHUB_PATH"

      # nvim-treesitter's main branch shells out to this CLI to build every
      # parser; without it every parser install fails with ENOENT.
      - name: Install tree-sitter CLI
        run: |
          curl -fsSLo /tmp/tree-sitter.zip https://github.com/tree-sitter/tree-sitter/releases/latest/download/${{ matrix.ts_asset }}.zip
          unzip -o /tmp/tree-sitter.zip -d /tmp/tree-sitter-bin
          echo "/tmp/tree-sitter-bin" >> "$GITHUB_PATH"

      - name: Point an isolated XDG config at this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/xdg/config" "$RUNNER_TEMP/xdg/data" "$RUNNER_TEMP/xdg/state" "$RUNNER_TEMP/xdg/cache"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/xdg/config/nvim"
          {
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg/config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/xdg/state"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg/cache"
          } >> "$GITHUB_ENV"

      # No cache: a red run here means upstream drift and do not update lazy-lock.json
      #
      # nvim-treesitter's config() kicks off its own parser install async;wait avoids race condition
      - name: Install latest plugin commits
        run: nvim --headless -c "Lazy! sync" -c "lua require('configs.treesitter').task:wait(120000)" -c "qa"

      - name: Run smoke test
        run: nvim --headless -c "luafile scripts/smoke_test.lua"

      # Only one matrix leg's lazy-lock.json needs to travel to the push job below
      # every OS resolves the same upstream commits from the same version constraints.
      - name: Upload lazy-lock.json
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lazy-lock-json
          path: lazy-lock.json

  # Separate job, gated on every matrix leg of `smoke` passing, so
  # lazy-lock.json only ever gets pushed once confirmed safe on every OS
  push-lock-file:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials (default true) is load-bearing; leaves cred in .git/config
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: lazy-lock-json

      - name: Commit and push lazy-lock.json if it changed
        run: |
          if git diff --quiet -- lazy-lock.json; then
            echo "lazy-lock.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lazy-lock.json
          git commit -m "chore(deps): update lazy-lock.json"
          git push origin HEAD:main
